    { name = "Aniruddh Galande", email = "aniruddhgalande94@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=1.7.0",
    "pandas>=3.1.0",
    "pandasql>=0.7.3",
